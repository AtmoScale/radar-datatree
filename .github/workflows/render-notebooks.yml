name: Render Notebooks

on:
  push:
    branches: [main]
    paths:
      - 'notebooks/**'
      - 'docs/**'
      - 'images/**'
      - 'assets/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/render-notebooks.yml'
  pull_request:
    branches: [main]
    paths:
      - 'notebooks/**'
      - 'docs/**'
      - 'images/**'
      - 'assets/**'
      # A dependency bump invalidates both caches below, so it must trigger CI
      # too — otherwise the next notebook PR eats the cold-cache failure.
      - 'pyproject.toml'
      - 'uv.lock'
      # Workflow-file-only PRs (like the cold-cache fix in PR #24) must
      # also trigger CI so the workflow itself is validated against PR diffs.
      - '.github/workflows/render-notebooks.yml'
  workflow_dispatch:  # Allow manual triggering
  # Weekly cold-cache canary: the notebooks read live, growing public archives,
  # so upstream drift (retention, re-ingest, a new VCP) can break them with no
  # repo change at all. This run skips the execution cache to actually hit S3.
  schedule:
    - cron: '0 6 * * 1'

# Cancel previous runs on the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python and create venv
        run: |
          uv python install 3.12
          uv venv --python 3.12

      - name: Cache virtual environment
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-py3.12-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-py3.12-

      # Cache MyST-NB's notebook execution results between runs. The cache key
      # invalidates when dependencies change (pyproject.toml, uv.lock) — new
      # package versions could break notebooks even with unchanged code.
      # Notebook source changes (notebooks/*.ipynb) are handled automatically by
      # jupyter-cache's per-cell hashing, so they don't need to be in the key.
      # Notebooks are self-contained (no shared helper module), so there is no
      # cross-notebook import to track here.
      # Upstream-data drift (S3 layout, retention, a new VCP) is NOT caught by
      # this key — the weekly `schedule:` run above skips this cache entirely so
      # it re-executes cold against the live archives.
      - name: Cache jupyter-cache (MyST-NB execution outputs)
        if: github.event_name != 'schedule'
        uses: actions/cache@v4
        with:
          path: _build/.jupyter_cache
          key: nbcache-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            nbcache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          uv sync --group dev

      - name: Run linting checks
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run black --check notebooks/

      - name: Version Info
        run: |
          uv run python -c "import xarray; print(f'xarray: {xarray.__version__}')"
          uv run python -c "import xradar; print(f'xradar: {xradar.__version__}')"
          uv run python -c "import zarr; print(f'zarr: {zarr.__version__}')"
          uv run python -c "import icechunk; print(f'icechunk: {icechunk.__version__}')"

      - name: Build documentation with Sphinx/MyST-NB
        run: |
          # Serial build. `-j auto` causes a cold-cache race: parallel workers
          # try to CREATE TABLE nbproject in the jupyter_cache SQLite at the
          # same time and one of them fails with "table already exists" (CI
          # run #25555606153). Parallelism returns in Phase 7 once
          # actions/cache warm-starts _build/.jupyter_cache/ between runs,
          # so workers always find the SQLite already initialized.
          uv run sphinx-build -b html docs _build/html

          # Copy notebook images to build output
          cp -r notebooks/*.png _build/html/ 2>/dev/null || true
          cp -r images/ _build/html/images/ 2>/dev/null || true
          cp -r assets/ _build/html/assets/ 2>/dev/null || true

      - name: Upload artifact for Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: render
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
